name: Build Mod
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Android64
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/*.geode
